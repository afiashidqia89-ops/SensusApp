name: Mobile CI
on:
  pull_request:
    paths: ['apps/mobile/**']
  push:
    branches: [main]
    paths: ['apps/mobile/**']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
